# Allow `unwrap()`/`expect()` inside test functions and `#[cfg(test)]` modules.
# Production code keeps `clippy::unwrap_used`/`expect_used = deny` (see the
# workspace Cargo.toml); tests legitimately unwrap to fail loudly, so this is
# the upstream-recommended exception rather than scattering `#[allow]` across
# every test module in ~60 member crates. Mirrors ewf-forensic's clippy.toml.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
